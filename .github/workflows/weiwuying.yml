name: 本機抓取衛武營與文化部

# 這兩個來源改在台灣的 self-hosted runner 抓：
# - 衛武營擋 GitHub Actions 機房的 IP（nginx 直接回 403）
# - 文化部 iCulture 在 CI 執行的凌晨時段常缺 OPENTIX、年代售票匯入的活動（只剩約四成，有時只剩個位數），
#   本機 23:30 抓則完整
# 只提交 data/sources/ 的快取，網頁資料由「每日更新活動」以 --skip 合併輸出。
on:
  schedule:
    - cron: "30 15 * * *" # UTC 15:30 = 台灣時間 23:30，比每日更新早半小時
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-weiwuying
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: [self-hosted, Windows]
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    # 讓 Python 以 UTF-8 輸出，否則 Windows 預設 cp950，日誌的中文會變亂碼
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - run: py -3.14 -m venv .venv
      - run: .venv\Scripts\python -m pip install -q -r requirements.txt

      # 有來源失敗時程式回傳非 0，但成功的來源快取已寫出：先提交，最後再標記失敗
      - name: 抓取活動
        id: fetch
        run: .venv\Scripts\python -m eventradar --only weiwuying iculture
        continue-on-error: true

      # Windows PowerShell 5.1 會把 runner 產生的腳本（無 BOM 的 UTF-8）當成 Big5 讀，
      # 腳本內不能有中文；中文 commit 訊息改由環境變數傳入
      # --only 仍會重寫 docs/data 與 first_seen.json（交給每日更新產生），commit 後先丟掉才能 pull --rebase
      - name: 提交資料
        env:
          COMMIT_MESSAGE: 更新衛武營與文化部活動資料
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sources/weiwuying.json data/sources/iculture.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            echo "No changes"
            exit 0
          }
          git commit -q -m $env:COMMIT_MESSAGE
          git checkout -q -- .
          git pull --rebase -q
          git push -q

      - name: 有來源失敗
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error::Some sources failed, see the fetch step log"
          exit 1
