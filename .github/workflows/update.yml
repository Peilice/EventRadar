name: 每日更新活動

on:
  schedule:
    - cron: "0 16 * * *" # UTC 16:00 = 台灣時間 00:00
  # 本機 runner 的電腦沒開機時，排程工作會排隊到開機才跑（實際多在早上），
  # 晚於每日更新，網站上那四個來源會晚將近一天；所以它跑完就再更新一次網站
  workflow_run:
    workflows: ["本機抓取衛武營、文化部、拓元與美術館"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-events
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # 本機 workflow 失敗或沒有新資料時不必重跑（每次都會重抓雲端的八個來源）
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    # 五個逐頁抓詳情的來源各有 5 分鐘上限（eventradar/http.py 的 DETAIL_BUDGET），
    # 上限只在每頁之間檢查，逾時的請求還會重試，每個來源可能再超出約 3 分鐘，最壞約 40 分鐘
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m pytest -q

      # 有來源失敗時程式回傳非 0，但資料仍已寫出：先提交，最後再標記失敗
      # 衛武營、文化部、拓元、美術館改由本機 runner 的「本機抓取衛武營、文化部、拓元與美術館」workflow 更新快取，這裡直接沿用
      - name: 抓取活動
        id: fetch
        run: python -m eventradar --skip weiwuying iculture tixcraft kmfa
        continue-on-error: true

      - name: 提交資料
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data data/sources data/first_seen.json
          if git diff --cached --quiet; then
            echo "資料沒有變動"
          else
            git commit -m "每日更新活動資料"
            git pull --rebase -q
            git push
          fi

      - name: 有來源失敗
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error::部分來源抓取失敗，詳見「抓取活動」步驟的紀錄"
          exit 1
