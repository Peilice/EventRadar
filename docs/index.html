<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>高雄活動雷達</title>
  <meta name="description" content="自動彙整高雄的政府與民間活動">
  <meta name="theme-color" content="#1e4fc7">
  <!-- 加到主畫面：圖示與名稱 -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="活動雷達">
  <meta name="application-name" content="活動雷達">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@400;500;700;800;900&family=Fredoka:wght@500;600;700&display=swap">
  <!-- 改了 style.css 或 app.js 就更新 ?v=，避免瀏覽器拿到快取裡的舊檔 -->
  <link rel="stylesheet" href="style.css?v=20261029b">
</head>
<body>
  <!-- 圖示：同一套 24px 格線、2px 圓頭線條 -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-exhibit" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></symbol>
      <symbol id="i-show" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></symbol>
      <symbol id="i-talk" viewBox="0 0 24 24"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/></symbol>
      <symbol id="i-fest" viewBox="0 0 24 24"><path d="M5 22V3"/><path d="M5 4h13l-3 4.5 3 4.5H5"/></symbol>
      <symbol id="i-market" viewBox="0 0 24 24"><path d="M3 9 4.5 4h15L21 9"/><path d="M3 9a3 3 0 0 0 6 0 3 3 0 0 0 6 0 3 3 0 0 0 6 0"/><path d="M5 12v8h14v-8"/><path d="M10 20v-5h4v5"/></symbol>
      <symbol id="i-kids" viewBox="0 0 24 24"><path d="M12 16c-3.5 0-6-3-6-6.5a6 6 0 0 1 12 0c0 3.5-2.5 6.5-6 6.5z"/><path d="m12 16-1.2 2h2.4z"/><path d="M12 18c0 2-2 2-2 4"/></symbol>
      <symbol id="i-sport" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a14 14 0 0 1 0 18"/><path d="M12 3a14 14 0 0 0 0 18"/><path d="M3 12h18"/></symbol>
      <symbol id="i-other" viewBox="0 0 24 24"><path d="m12 3 2.2 5.8L20 11l-5.8 2.2L12 19l-2.2-5.8L4 11l5.8-2.2z"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
      <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></symbol>
      <symbol id="i-org" viewBox="0 0 24 24"><path d="M4 21V5l8-2v18"/><path d="M12 9h8v12"/><path d="M2 21h20"/><path d="M8 8v.01M8 12v.01M8 16v.01M16 13v.01M16 17v.01"/></symbol>
      <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></symbol>
      <symbol id="i-hourglass" viewBox="0 0 24 24"><path d="M6 3h12M6 21h12"/><path d="M7 3c0 5 5 6 5 9s-5 4-5 9"/><path d="M17 3c0 5-5 6-5 9s5 4 5 9"/></symbol>
      <symbol id="i-want" viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7a4.3 4.3 0 0 1 7.5 2.8C19.5 15.4 12 20 12 20z"/></symbol>
      <symbol id="i-going" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a3 3 0 0 0 0 6v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a3 3 0 0 0 0-6z"/><path style="fill:none;stroke:var(--tear,currentColor)" d="M15 5.5v1.5M15 11.25v1.5M15 17v1.5"/></symbol>
      <symbol id="i-chev-left" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol>
      <symbol id="i-chev-right" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
      <symbol id="i-radar" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><path d="M12 12 18.4 5.6"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
      <symbol id="i-link" viewBox="0 0 24 24"><path d="M14 4h6v6"/><path d="M20 4 11 13"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
    </defs>
  </svg>

  <!-- 頂部黏住：標誌、搜尋、月曆、篩選；下面是時段按鈕（桌機）與日期條 -->
  <div class="top" id="top">
    <header class="bar-head">
      <a class="brand" href="./" aria-label="高雄活動雷達">
        <svg class="logo" viewBox="0 0 100 100" aria-hidden="true">
          <circle class="logo-disc" cx="50" cy="50" r="46"/>
          <circle class="logo-ring" cx="50" cy="50" r="31"/>
          <circle class="logo-ring" cx="50" cy="50" r="16"/>
          <g class="logo-sweep"><path d="M50 50 L50 4 A46 46 0 0 1 89.8 27 Z"/></g>
          <circle class="logo-blip" cx="68" cy="30" r="5"/>
          <circle class="logo-blip b2" cx="30" cy="62" r="4"/>
          <circle class="logo-core" cx="50" cy="50" r="5"/>
        </svg>
        <h1 class="brand-name">高雄活動雷達</h1>
      </a>
      <label class="search">
        <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
        <input type="search" id="q" placeholder="搜尋活動、場地" autocomplete="off" aria-label="搜尋活動">
      </label>
      <button type="button" class="view-toggle" id="view-toggle" aria-label="我的標記月曆" title="我的標記月曆">
        <!-- 彩色月曆：橘色頂條、白紙面、海藍日期點，黃點是標記的那天 -->
        <svg class="cal-icon" viewBox="0 0 24 24" aria-hidden="true">
          <rect class="ci-body" x="3" y="5" width="18" height="16" rx="3"/>
          <path class="ci-band" d="M3 10V8a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3v2z"/>
          <path class="ci-ring" d="M8 3v4M16 3v4"/>
          <circle class="ci-dot" cx="8" cy="14" r="1.3"/>
          <circle class="ci-dot" cx="12" cy="14" r="1.3"/>
          <circle class="ci-dot" cx="8" cy="17.5" r="1.3"/>
          <circle class="ci-dot" cx="12" cy="17.5" r="1.3"/>
          <circle class="ci-mark" cx="16" cy="15.8" r="2.4"/>
        </svg>
        <!-- 月曆模式改顯示列表：兩張疊起的活動卡片，與月曆同樣是橘色頂條、黃點標記 -->
        <svg class="cal-icon list-icon" viewBox="0 0 24 24" aria-hidden="true">
          <rect class="ci-body" x="7" y="3" width="13.5" height="12" rx="2.5"/>
          <rect class="ci-body" x="3.5" y="7" width="14.5" height="14" rx="2.5"/>
          <path class="ci-band" d="M3.5 11.5V9.5A2.5 2.5 0 0 1 6 7h9.5A2.5 2.5 0 0 1 18 9.5v2z"/>
          <path class="ci-line" d="M6.8 14.8h7.6M6.8 17.8h4.6"/>
          <circle class="ci-mark" cx="15.2" cy="18" r="1.6"/>
        </svg>
      </button>
      <button type="button" class="btn-filter" id="open-filters">
        <svg class="icon" aria-hidden="true"><use href="#i-sliders"/></svg><span class="btn-filter-text">篩選</span><span class="badge" id="filter-count" hidden></span>
      </button>
    </header>
    <nav class="ranges" id="ranges" aria-label="時段"></nav>
    <!-- 日期條：桌機點了捲到那天；手機一次看一天，用箭頭前後切換 -->
    <div class="strip-wrap" id="strip-wrap">
      <button type="button" class="strip-arrow" id="day-prev" aria-label="前一天"><svg class="icon" aria-hidden="true"><use href="#i-chev-left"/></svg></button>
      <div class="strip" id="strip" aria-label="日期"></div>
      <button type="button" class="strip-arrow" id="day-next" aria-label="後一天"><svg class="icon" aria-hidden="true"><use href="#i-chev-right"/></svg></button>
    </div>
  </div>

  <main class="main">
    <p class="meta" id="meta">載入中…</p>

    <section id="list-view">
      <div class="status-row">
        <div class="tabs" role="tablist" aria-label="活動類型">
          <button type="button" role="tab" data-tab="day">單日活動 <b id="n-day"></b></button>
          <button type="button" role="tab" data-tab="long">長期展覽 <b id="n-long"></b></button>
        </div>
        <div class="group-toggle" id="group-toggle" role="group" aria-label="顯示方式">
          <button type="button" data-group="day">依日期</button>
          <button type="button" data-group="event">依活動</button>
        </div>
      </div>
      <div class="active-filters" id="active-filters"></div>
      <div class="list" id="list" aria-live="polite"></div>
    </section>

    <!-- 月曆：只顯示有標記的活動，不套用篩選。id 不叫 calendar，避免 #calendar 讓瀏覽器捲動到這裡 -->
    <section class="calendar" id="cal-view" aria-label="我的標記月曆" hidden>
      <div class="cal-head">
        <div class="cal-nav">
          <button type="button" class="cal-btn" id="cal-prev" aria-label="上個月"><svg class="icon" aria-hidden="true"><use href="#i-chev-left"/></svg></button>
          <h2 class="cal-title" id="cal-title" aria-live="polite"></h2>
          <button type="button" class="cal-btn" id="cal-next" aria-label="下個月"><svg class="icon" aria-hidden="true"><use href="#i-chev-right"/></svg></button>
          <button type="button" class="reset cal-today" id="cal-today">今天</button>
        </div>
        <div class="chips" id="cal-legend" aria-label="只看"></div>
      </div>
      <p class="hint cal-empty" id="cal-empty" hidden>還沒有標記任何活動。在列表點活動右邊的愛心，或在詳情裡點「想去」「已報名」，就會出現在月曆上。</p>
      <div class="cal-body">
        <div class="cal-grid" id="cal-grid"></div>
        <div class="cal-agenda" id="cal-agenda" aria-label="選取日期的活動"></div>
      </div>
      <section class="cal-long" id="cal-long" hidden>
        <h2 class="cal-long-title"><svg class="icon" aria-hidden="true"><use href="#i-hourglass"/></svg><span id="cal-long-title"></span></h2>
        <p class="hint">展期超過 14 天的活動不畫在月曆格子上，依結束日期排序。</p>
        <div id="cal-long-list"></div>
      </section>
    </section>
  </main>

  <footer class="site-footer">
    <svg class="wave wave-top" viewBox="0 0 1440 60" preserveAspectRatio="none" aria-hidden="true">
      <path class="wave-back" d="M0 40c120-18 240-18 360 0s240 18 360 0 240-18 360 0 240 18 360 0V0H0z"/>
      <path d="M0 30c120 22 240 22 360 0s240-22 360 0 240 22 360 0 240-22 360 0V0H0z"/>
    </svg>
    <div class="footer-inner">
      <h2>資料來源狀態</h2>
      <table class="status">
        <thead><tr><th>來源</th><th>最後成功更新</th><th>筆數</th></tr></thead>
        <tbody id="status-body"></tbody>
      </table>
      <p class="hint">每天 00:00 自動更新。費用與主辦類型由規則推斷，判斷不出來時標示「未知」或「不確定」。</p>
    </div>
  </footer>

  <div class="scrim" id="scrim" hidden></div>

  <!-- 活動詳情：桌機從右側滑出，手機是底部面板 -->
  <aside class="panel drawer" id="drawer" aria-label="活動詳情" hidden>
    <button type="button" class="panel-close" data-close aria-label="關閉"><svg class="icon" aria-hidden="true"><use href="#i-x"/></svg></button>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>

  <aside class="panel sheet" id="sheet" aria-label="篩選" hidden>
    <div class="sheet-head">
      <h2>篩選</h2>
      <button type="button" class="panel-close" data-close aria-label="關閉"><svg class="icon" aria-hidden="true"><use href="#i-x"/></svg></button>
    </div>
    <div class="sheet-body">
      <fieldset class="field">
        <legend>分類</legend>
        <div class="chips" id="f-cats"></div>
      </fieldset>
      <fieldset class="field">
        <legend>費用</legend>
        <div class="chips" id="f-fee"></div>
      </fieldset>
      <fieldset class="field">
        <legend>我的標記與新增</legend>
        <div class="chips" id="f-marks"></div>
        <p class="hint">選取時不限日期。標記存在這台裝置的瀏覽器，活動結束後自動移除。</p>
        <div class="sync">
          <button type="button" class="reset" id="sync-share">分享同步連結</button>
          <input type="text" class="sync-link" id="sync-link" readonly aria-label="同步連結" hidden>
          <p class="hint sync-msg" id="sync-msg" aria-live="polite"></p>
        </div>
      </fieldset>
      <!-- 手機用日期條選日子，不需要自訂日期 -->
      <fieldset class="field field-dates">
        <legend>自訂日期</legend>
        <div class="field-row">
          <label class="field"><span>從</span><input type="date" id="f-from"></label>
          <label class="field"><span>到</span><input type="date" id="f-to"></label>
        </div>
      </fieldset>
      <label class="field">
        <span>行政區</span>
        <select id="f-district"><option value="">全部行政區</option></select>
      </label>
      <fieldset class="field">
        <legend>來源</legend>
        <div class="chips" id="f-srcs"></div>
      </fieldset>
    </div>
    <div class="sheet-foot">
      <button type="button" class="reset" id="f-reset">清除全部</button>
      <button type="button" class="btn-primary" data-close id="f-apply">顯示活動</button>
    </div>
  </aside>

  <script src="app.js?v=20261029b"></script>
</body>
</html>
